name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers (pull request)
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Install browsers (main)
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium webkit

      - name: E2E smoke and a11y (pull request)
        if: github.event_name == 'pull_request'
        run: npx playwright test --project=chromium-desktop

      - name: E2E full matrix (main)
        if: github.event_name == 'push'
        run: npx playwright test --project=chromium-desktop --project=webkit-desktop --project=mobile-chrome --project=mobile-safari

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
